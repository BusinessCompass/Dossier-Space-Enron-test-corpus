function activeEdges(){const m=+minInput.value;return edges.filter(e=>e.count>=m&&(!selected||directionSelect.value==='all'||(directionSelect.value==='out'&&e.source===selected)||(directionSelect.value==='in'&&e.target===selected)));}
function simulate(steps=1){const list=activeEdges();for(let k=0;k<steps;k++){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,f=900/d2;a.vx+=dx*f*.01;a.vy+=dy*f*.01;b.vx-=dx*f*.01;b.vy-=dy*f*.01;}for(const e of list){let a=e.sourceNode,b=e.targetNode,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,target=95-Math.min(40,Math.sqrt(e.count)*3),f=(d-target)*.0018;a.vx+=dx/d*f;b.vx-=dx/d*f;a.vy+=dy/d*f;b.vy-=dy/d*f;}for(const n of nodes){if(n===dragging)continue;n.vx+=(width/2-n.x)*.0007;n.vy+=(height/2-n.y)*.0007;n.vx*=.86;n.vy*=.86;n.x=Math.max(14,Math.min(width-14,n.x+n.vx));n.y=Math.max(14,Math.min(height-14,n.y+n.vy));}}draw();}
function nodeRadius(n){return 4+Math.min(9,Math.sqrt(n.incident)*.42)}
function drawArrow(a,b,color,alpha){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,r=nodeRadius(b),x=b.x-dx/d*(r+2),y=b.y-dy/d*(r+2),ang=Math.atan2(dy,dx);ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(ang-.5)*7,y-Math.sin(ang-.5)*7);ctx.lineTo(x-Math.cos(ang+.5)*7,y-Math.sin(ang+.5)*7);ctx.closePath();ctx.fill();}
function draw(){const c=colors(),list=activeEdges();ctx.clearRect(0,0,width,height);for(const e of list){const related=!selected||e.source===selected||e.target===selected,alpha=selected?(related?.78:.08):.28;ctx.globalAlpha=alpha;ctx.strokeStyle=related&&selected?c.series:c.muted;ctx.lineWidth=.55+Math.sqrt(e.count)*.55;ctx.beginPath();ctx.moveTo(e.sourceNode.x,e.sourceNode.y);ctx.lineTo(e.targetNode.x,e.targetNode.y);ctx.stroke();if(related&&selected)drawArrow(e.sourceNode,e.targetNode,c.series,alpha);}for(const n of nodes){const related=!selected||n.id===selected||list.some(e=>(e.source===selected&&e.target===n.id)||(e.target===selected&&e.source===n.id));ctx.globalAlpha=selected&&!related?.18:1;ctx.fillStyle=n.id==='john.dudmesh@enron.com'?c.series2:(n.id===selected?c.series:c.fg);ctx.beginPath();ctx.arc(n.x,n.y,nodeRadius(n),0,Math.PI*2);ctx.fill();if(n.id===selected||n===hovered){ctx.globalAlpha=1;ctx.strokeStyle=c.border;ctx.lineWidth=2;ctx.stroke();}}ctx.globalAlpha=1;}
function resize(){const rect=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);width=Math.max(320,rect.width);height=rect.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);resetPositions();}
function pointer(event){const r=canvas.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top}}
function nearest(p){let hit=null,best=Infinity;for(const n of nodes){const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<=nodeRadius(n)+7&&d<best){hit=n;best=d;}}return hit;}
function updateDetail(){if(!selected){detail.textContent='Select a node to inspect its strongest displayed relationships.';return;}const n=byId.get(selected), rel=edges.filter(e=>e.source===selected||e.target===selected).sort((a,b)=>b.count-a.count).slice(0,6);detail.replaceChildren();const strong=document.createElement('strong');strong.textContent=n.label+' ('+n.id.replace(/^name:/,'')+')';detail.append(strong);const list=document.createElement('ul');list.className='s20-list';for(const e of rel){const li=document.createElement('li'),out=e.source===selected,other=byId.get(out?e.target:e.source);li.textContent=(out?'to ':'from ')+(other?other.label:(out?e.target:e.source))+': '+e.count+' exchange'+(e.count===1?'':'s')+'; '+(e.first||'date unavailable')+' to '+(e.last||'date unavailable');list.append(li);}if(!rel.length){const span=document.createElement('span');span.textContent=' — no relationships in the displayed reduction.';detail.append(span);}else detail.append(list);}
canvas.addEventListener('pointerdown',e=>{const n=nearest(pointer(e));if(n){dragging=n;canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{const p=pointer(e);if(dragging){dragging.x=p.x;dragging.y=p.y;draw();return;}hovered=nearest(p);if(hovered){tooltip.style.display='block';tooltip.style.left=Math.min(width-230,p.x+12)+'px';tooltip.style.top=Math.max(4,p.y-12)+'px';tooltip.textContent=hovered.label+' — sent '+hovered.sent+', received '+hovered.received;}else tooltip.style.display='none';draw();});
canvas.addEventListener('pointerup',e=>{const p=pointer(e),n=nearest(p);if(dragging&&n===dragging){selected=n.id;personSelect.value=selected;updateDetail();simulate(70);}dragging=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointerleave',()=>{hovered=null;tooltip.style.display='none';draw();});
minInput.addEventListener('input',()=>{minValue.textContent=minInput.value;simulate(60);});
personSelect.addEventListener('change',()=>{selected=personSelect.value;updateDetail();simulate(60);});
directionSelect.addEventListener('change',()=>simulate(60));
root.querySelector('#s20-reset').addEventListener('click',()=>{selected='';personSelect.value='';directionSelect.value='all';minInput.value='2';minValue.textContent='2';updateDetail();resetPositions();});
new ResizeObserver(resize).observe(canvas);window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
})();
</script></body></html>
